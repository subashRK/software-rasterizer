<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>CG - Hands on</title>

		<script src="./app.js" type="module" defer></script>
	</head>
	<body>
		<h1>CG - Hands on</h1>

		<div class="canvas-container">
			<canvas id="render-screen" width="800" height="450">
				<!-- Height and width are chosen as to maintain 16:9 aspect ration. Why? Ah Ah summa... -->
				<span>Render Screen. Engine renders the graphics here.</span>
			</canvas>
		</div>

		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			html {
				font-family: sans-serif;
			}

			body {
				background-color: rgb(25, 25, 25);
				color: whitesmoke;
			}

			h1 {
				font-weight: normal;
				margin: 20px 50px;
			}

			#render-screen {
				background: rgb(35 35 35);
				border-radius: 3px;
				box-shadow: inset 0px 3px 10px 5px rgba(15, 15, 15, 0.2);
			}

			.canvas-container {
				width: 100vw;
				display: flex;
				align-items: center;
				justify-content: center;
				margin-top: 50px;
			}
		</style>
	</body>
</html>
